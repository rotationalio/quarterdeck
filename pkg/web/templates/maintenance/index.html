<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance | Quarterdeck</title>

  <style>
    body {
      background-color: #f7f9fc;
      color: #6c757d;
      opacity: 1 !important;
      overflow-y: scroll;
      height: 100%;
      font-family: "Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
      font-size: 0.825rem;
      font-weight: 400;
      line-height: 1.625;
      margin: 0;
    }

    .auth-full-page {
      height: 100vh;
    }

    .d-flex {
        display: flex !important;
    }

    .auth-form {
      max-width: 500px;
      margin: auto;
      width: 100%;
    }

    .p-3 {
      padding: 1rem !important;
    }

    .text-center {
      text-align: center !important;
    }

    .fw-bold {
      font-weight: 500 !important;
    }

    .display-1 {
      font-size: 5rem;
      line-height: 1.2;
      color: #495057;
    }

    h1 {
      display: block;
      margin-block-start: 0.67em;
      margin-block-end: 0.67em;
      margin-inline-start: 0px;
      margin-inline-end: 0px;
      unicode-bidi: isolate;
      margin-bottom: .5rem;
      margin-top: 0;
    }

    .h2 {
      color: #495057;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: .5rem;
      margin-top: 0;
      font-size: 1.44375rem;
    }

    .fw-normal {
      font-weight: 400 !important;
    }

    .mb-4 {
      margin-bottom: 1.5rem !important;
    }

    .mt-3 {
      margin-top: 1rem !important;
    }

    .lead {
      font-size: 1.03125rem;
    }
  </style>
</head>
<body>
  <div class="auth-full-page d-flex">
    <div class="auth-form p-3">
      <div class="text-center">
        <h1 class="display-1 fw-bold">503</h1>
        <p class="h2">Temporary Maintenance 🚧</p>
        <p class="lead fw-normal mt-3 mb-4">
          Quarterdeck v{{ .Version }} is in maintenance mode but should be available soon.
          Please try again later.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
